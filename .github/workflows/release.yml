name: Release

# Builds the Windows installer from a tag and attaches it to a GitHub release.
# The desktop repo holds no UI code, so this checks out the private Keel web app
# alongside it, builds both, and records which Keel commit went into the binary.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.2.0). Defaults to the tag, else 0.0.0-dev."
        required: false
        type: string
      keel_ref:
        description: "Keel branch, tag or SHA to build against."
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  KEEL_REPO: FrameStudio-cloud/keel
  KEEL_REF: ${{ inputs.keel_ref || 'main' }}
  # Vite exposes process.env vars prefixed with VITE_, and keel's vite.config.js
  # throws if these two are absent. They are compile-time values baked into the
  # bundle, not runtime config.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # Optional: without these the CI build still works, but analytics, payments or
  # Google Calendar would be silently absent compared with a local build.
  VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
  VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
  VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out desktop shell
        uses: actions/checkout@v4

      - name: Check build secrets
        env:
          KEEL_REPO_TOKEN: ${{ secrets.KEEL_REPO_TOKEN }}
        run: |
          missing=0
          if [ -z "$KEEL_REPO_TOKEN" ]; then
            echo "::error::$KEEL_REPO is private. Add a fine-grained PAT with Contents: read on that repo as the KEEL_REPO_TOKEN secret."
            missing=1
          fi
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::The VITE_SUPABASE_URL secret is missing."
            missing=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::The VITE_SUPABASE_ANON_KEY secret is missing."
            missing=1
          fi
          exit "$missing"

      - name: Check out Keel web app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KEEL_REPO }}
          ref: ${{ env.KEEL_REF }}
          token: ${{ secrets.KEEL_REPO_TOKEN }}
          path: keel

      - name: Resolve Keel commit
        id: keel
        run: |
          echo "sha=$(git -C keel rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Keel $KEEL_REPO@$KEEL_REF -> $(git -C keel rev-parse --short HEAD)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the machine the app is normally built and tested on. Keel's
          # engines allow ^20.19 || >=22.12, so 24 is supported.
          node-version: 24
          cache: pnpm

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Keel dependencies
        working-directory: keel
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "value=${version#v}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version#v}"

      - name: Stamp version into the Tauri manifests
        run: node scripts/stamp-version.mjs "${{ steps.version.outputs.value }}"

      - name: Build installer
        env:
          KEEL_ROOT: keel
        run: pnpm build

      # Cheap structural gate before anything is published. The nightly canary
      # does the full browser render; this just refuses to ship a bundle whose
      # assets do not resolve or whose filenames kept their spaces.
      - name: Canary (structural)
        run: pnpm canary --no-render

      - name: Collect artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          msi=(src-tauri/target/release/bundle/msi/*.msi)
          nsis=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#msi[@]} -eq 0 ] || [ ${#nsis[@]} -eq 0 ]; then
            echo "::error::Expected both an MSI and an NSIS installer under src-tauri/target/release/bundle."
            ls -R src-tauri/target/release/bundle || true
            exit 1
          fi
          cp "${msi[@]}" "${nsis[@]}" out/
          {
            echo "version: ${{ steps.version.outputs.value }}"
            echo "keel: ${{ env.KEEL_REPO }}@${{ steps.keel.outputs.sha }} (ref: ${{ env.KEEL_REF }})"
            echo "desktop: ${{ github.repository }}@${GITHUB_SHA::7}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > out/BUILD-INFO.txt
          ls -lh out

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keel-desktop-${{ steps.version.outputs.value }}
          path: out/*
          retention-days: 14

      - name: Write release notes
        if: github.ref_type == 'tag'
        run: |
          {
            echo "Windows installers for Keel Desktop ${GITHUB_REF_NAME}."
            echo
            echo "| Component | Built from |"
            echo "|---|---|"
            echo "| Keel web app | \`${{ env.KEEL_REPO }}@${{ steps.keel.outputs.sha }}\` (ref: \`${{ env.KEEL_REF }}\`) |"
            echo "| Desktop shell | \`${{ github.repository }}@${GITHUB_SHA::7}\` |"
            echo
            echo "**MSI** — \`Keel_${{ steps.version.outputs.value }}_x64_en-US.msi\`"
            echo
            echo "**NSIS** — \`Keel_${{ steps.version.outputs.value }}_x64-setup.exe\`"
          } > release-notes.md

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Keel Desktop $GITHUB_REF_NAME" \
            --notes-file release-notes.md
